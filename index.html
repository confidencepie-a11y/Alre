<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Wallet</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <main class="screen on" id="home">
    <div class="top">
      <div class="who"><div class="avatar" aria-hidden="true">A</div><span>Hi, AbdulQudus</span></div>
      <button class="bell" aria-label="Notifications">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
      </button>
    </div>

    <section class="card" aria-label="Balance">
      <div class="acct">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8" transform="translate(-1 0)"/></svg>
        <span>7032******</span>
      </div>
      <div class="bal">
        <span id="balance">$0</span>
        <button id="eye" aria-label="Hide balance" aria-pressed="false">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <p class="upd" id="upd">Updated just now</p>
    </section>

    <div class="actions">
      <button class="act"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></i>Send</button>
      <button class="act"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17M16 17H7V8"/></svg></i>Receive</button>
      <button class="act"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M8 8v8M12 8v8M16 8v8"/></svg></i>QR Code</button>
      <button class="act"><i><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 8v8M8 12h8"/></svg></i>Add</button>
    </div>

    <h2>Transaction History</h2>
    <div id="txs"></div>
  </main>

  <main class="screen" id="cards"><h2 class="first">Cards</h2><p class="empty">No cards yet.</p></main>
  <main class="screen" id="user"><h2 class="first">User</h2><p class="empty">Profile coming soon.</p></main>

  <nav class="nav" role="tablist" aria-label="Main">
    <button class="tab" role="tab" aria-selected="true" data-t="home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5 2.5 10.6V21a.5.5 0 0 0 .5.5h6.2v-6.3h5.6v6.3H21a.5.5 0 0 0 .5-.5V10.6z"/></svg>Home
    </button>
    <button class="tab" role="tab" aria-selected="false" data-t="cards">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14M3 9.5h18"/><rect x="3" y="9.5" width="18" height="10" rx="1.5"/></svg>Cards
    </button>
    <button class="tab" role="tab" aria-selected="false" data-t="user">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="10" r="3"/><path d="M6 19c1.5-3 3.6-4 6-4s4.5 1 6 4"/></svg>User
    </button>
  </nav>
</div>
<script src="script.js"></script>
</body>
</html>
